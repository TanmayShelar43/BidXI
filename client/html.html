
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidXI - Stadium Auction</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #030914;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.stadium {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
        linear-gradient(180deg,
            #030817 0%,
            #0a1c37 22%,
            #142e4b 42%,
            #163b36 65%,
            #061c13 100%);
}

/* NIGHT SKY */
.sky {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        radial-gradient(ellipse at 50% 45%, #3979a833, transparent 55%),
        linear-gradient(#020714, #102b43 65%, #071c19);
}

/* STADIUM LIGHTS */
.floodlight {
    position: absolute;
    top: 55px;
    width: 260px;
    height: 260px;
    z-index: -1;
    background: radial-gradient(
        circle,
        #ffffffb0 0%,
        #b8dfff55 8%,
        #7ebeff22 28%,
        transparent 70%
    );
    filter: blur(9px);
}

.floodlight.left {
    left: -70px;
}

.floodlight.right {
    right: -70px;
}

.light-beam {
    position: absolute;
    top: 100px;
    width: 400px;
    height: 600px;
    background: linear-gradient(
        180deg,
        #b9ddff20,
        transparent 75%
    );
    filter: blur(35px);
    z-index: -2;
}

.light-beam.left {
    left: 0;
    transform: rotate(18deg);
}

.light-beam.right {
    right: 0;
    transform: rotate(-18deg);
}

/* STADIUM STANDS */
.stands {
    position: absolute;
    top: 190px;
    width: 100%;
    height: 300px;
    z-index: -2;
    background:
        repeating-linear-gradient(
            0deg,
            #263d51 0px,
            #263d51 13px,
            #101f32 14px,
            #101f32 21px
        );
    clip-path: polygon(0 0, 100% 0, 91% 100%, 9% 100%);
    opacity: .85;
}

.stands::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle, #ffffff 1px, transparent 2px),
        radial-gradient(circle, #62a8ff 1px, transparent 2px);
    background-size: 9px 9px, 13px 13px;
    opacity: .35;
}

/* GROUND */
.ground {
    position: absolute;
    bottom: 0;
    left: -10%;
    width: 120%;
    height: 48%;
    z-index: -1;
    background:
        radial-gradient(ellipse at 50% 0%, #5d984b, transparent 55%),
        repeating-linear-gradient(
            90deg,
            #173e27 0px,
            #173e27 100px,
            #1c482d 100px,
            #1c482d 200px
        );
    border-radius: 50% 50% 0 0 / 12% 12% 0 0;
}

/* CENTER PITCH */
.pitch {
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 410px;
    z-index: -1;
    background:
        linear-gradient(90deg, #9b8c60, #c0ad79, #8e805a);
    clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    opacity: .8;
}

.pitch::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent 0 35px,
        #ffffff25 36px 38px
    );
}

/* GROUND LIGHTING */
.ground-glow {
    position: absolute;
    bottom: -160px;
    left: 50%;
    transform: translateX(-50%);
    width: 850px;
    height: 380px;
    background: #60c5ff22;
    filter: blur(80px);
    border-radius: 50%;
    z-index: -1;
}

/* NAVBAR */
nav {
    height: 85px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ffffff22;
    background: #02071466;
    backdrop-filter: blur(8px);
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #55aaff;
}

.live {
    color: #ff5555;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
}

.live i {
    display: inline-block;
    height: 8px;
    width: 8px;
    border-radius: 50%;
    background: red;
    margin-right: 8px;
    box-shadow: 0 0 15px red;
}

/* MAIN AUCTION */
.auction-content {
    min-height: calc(100vh - 145px);
    max-width: 1500px;
    margin: auto;
    padding: 45px 5%;
    display: grid;
    grid-template-columns: 1fr 1.25fr .85fr;
    align-items: center;
    gap: 20px;
    position: relative;
}

/* PLAYER DETAILS */
.player-info {
    z-index: 3;
}

.eyebrow {
    color: #70b8ff;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: bold;
}

.player-info h1 {
    font-size: clamp(45px, 6vw, 82px);
    line-height: .95;
    margin: 22px 0;
    letter-spacing: -3px;
    text-shadow: 0 5px 30px #000;
}

.player-role {
    font-size: 13px;
    color: #c5d6e9;
    letter-spacing: 3px;
}

.player-stats {
    display: flex;
    gap: 35px;
    margin-top: 45px;
}

.player-stats div {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.player-stats small,
.base-price small {
    font-size: 10px;
    color: #a6b9ce;
    letter-spacing: 2px;
}

.player-stats strong {
    font-size: 15px;
}

.base-price {
    margin-top: 40px;
}

.base-price h2 {
    font-size: 35px;
    margin-top: 10px;
}

.base-price span {
    color: #69b5ff;
    font-size: 15px;
}

/* PLAYER */
.player-visual {
    position: relative;
    height: 680px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 2;
}

.player-spotlight {
    position: absolute;
    bottom: 5%;
    width: 85%;
    height: 85%;
    background: radial-gradient(
        ellipse,
        #b9dcff35,
        #62aaff15 45%,
        transparent 75%
    );
    filter: blur(30px);
}

.player-image {
    position: relative;
    z-index: 2;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 0 30px #0009);
}

.upload-btn {
    position: absolute;
    bottom: 15px;
    z-index: 5;
    background: #0e2a48;
    border: 1px solid #68b7ff;
    color: white;
    padding: 11px 18px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 11px;
    letter-spacing: 1px;
}

.upload-btn:hover {
    background: #237df0;
}

#imageInput {
    display: none;
}

/* BID PANEL */
.bid-panel {
    z-index: 3;
    background: #07192dd9;
    border: 1px solid #ffffff30;
    padding: 30px 25px;
    border-radius: 12px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px #0005;
}

.bid-panel h2 {
    font-size: 32px;
    margin: 18px 0 28px;
}

.divider {
    height: 1px;
    background: #ffffff30;
    margin-bottom: 25px;
}

.bid-panel small {
    color: #a6b9ce;
    font-size: 10px;
    letter-spacing: 2px;
}

.bid-panel h3 {
    font-size: 15px;
    margin: 14px 0 25px;
}

.bid-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 5px;
    color: white;
    background: #247df0;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
}

.bid-button:hover {
    background: #4b9aff;
}

/* FOOTER */
footer {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    padding: 20px 6%;
    background: #02071499;
    border-top: 1px solid #ffffff20;
    color: #a4b8cc;
    font-size: 10px;
    letter-spacing: 2px;
}

/* RESPONSIVE */
@media(max-width: 900px) {
    .auction-content {
        grid-template-columns: 1fr 1fr;
    }

    .player-visual {
        height: 500px;
    }

    .bid-panel {
        grid-column: 1 / -1;
    }
}

@media(max-width: 600px) {
    .auction-content {
        grid-template-columns: 1fr;
    }

    .player-visual {
        grid-row: 1;
        height: 430px;
    }

    .player-info {
        grid-row: 2;
    }

    .bid-panel {
        grid-row: 3;
    }

    footer {
        flex-wrap: wrap;
        gap: 12px;
    }
}
</style>
</head>

<body>

<div class="stadium">

    <div class="sky"></div>
    <div class="floodlight left"></div>
    <div class="floodlight right"></div>
    <div class="light-beam left"></div>
    <div class="light-beam right"></div>
    <div class="stands"></div>
    <div class="ground"></div>
    <div class="pitch"></div>
    <div class="ground-glow"></div>

    <nav>
        <div class="logo">BID<span>XI</span></div>
        <div class="live"><i></i> LIVE AUCTION</div>
    </nav>

    <main class="auction-content">

        <section class="player-info">
            <p class="eyebrow">UP FOR BIDDING</p>

            <h1 id="playerName">VIRAT<br>KOHLI</h1>

            <p class="player-role" id="playerRole">
                INDIA • BATTER
            </p>

            <div class="player-stats">
                <div>
                    <small>ROLE</small>
                    <strong id="role">Batter</strong>
                </div>

                <div>
                    <small>COUNTRY</small>
                    <strong id="country">India</strong>
                </div>
            </div>

            <div class="base-price">
                <small>BASE PRICE</small>
                <h2 id="basePrice">₹2.00 <span>CR</span></h2>
            </div>
        </section>

        <section class="player-visual">
            <div class="player-spotlight"></div>

            <img
                class="player-image"
                id="playerImage"
                src="https://placehold.co/600x900/10243a/ffffff?text=Player+Photo"
                alt="Player"
            >

            <label for="imageInput" class="upload-btn">
                + UPLOAD PLAYER PHOTO
            </label>

            <input type="file" id="imageInput" accept="image/*">
        </section>

        <section class="bid-panel">
            <p class="eyebrow">CURRENT BID</p>

            <h2 id="currentBid">₹2.00 CR</h2>

            <div class="divider"></div>

            <small>HIGHEST BIDDER</small>

            <h3>Waiting for bids...</h3>

            <button class="bid-button" id="bidButton">
                PLACE BID ↗
            </button>
        </section>

    </main>

    <footer>
        <span>INDIAN PREMIER LEAGUE</span>
        <span>BIDXI • THE AUCTION EXPERIENCE</span>
    </footer>

</div>

<script>
const input = document.getElementById("imageInput");
const image = document.getElementById("playerImage");

let previousURL = null;

input.addEventListener("change", function(e) {
    const file = e.target.files[0];

    if (!file) return;

    if (previousURL) {
        URL.revokeObjectURL(previousURL);
    }

    previousURL = URL.createObjectURL(file);
    image.src = previousURL;
});

document.getElementById("bidButton").addEventListener("click", () => {
    alert("Preview only - bidding system is not connected.");
});
</script>

</body>
</html>
